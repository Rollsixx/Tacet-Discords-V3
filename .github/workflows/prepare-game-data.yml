name: Prepare game data candidate

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  gather:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Gather source and artwork changes
        run: node scripts/prepare-upstream-candidate.mjs
      - name: Open or update draft candidate review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/data-imports/CANDIDATE.md vendor/wuthering-tools/candidate-source.tar.gz && ! git ls-files --others --exclude-standard docs/data-imports/CANDIDATE.md vendor/wuthering-tools/candidate-source.tar.gz | grep -q .; then
            echo "No candidate changes to propose."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data-imports
          if test -f vendor/wuthering-tools/candidate-source.tar.gz; then git add vendor/wuthering-tools/candidate-source.tar.gz; fi
          git commit -m "Gather upstream game data candidate"
          git fetch origin data/upstream-candidate:refs/remotes/origin/data/upstream-candidate || true
          git push --force-with-lease origin HEAD:refs/heads/data/upstream-candidate
          if ! gh pr view data/upstream-candidate --json number >/dev/null 2>&1; then
            gh pr create --draft --base main --head data/upstream-candidate --title "Review upstream game data candidate" --body "Candidate optimizer source and artwork change inventory. Review and integrate catalog, scanner, icons, and rotation changes; run all checks before merging. The active scoring source is unchanged."
          fi
